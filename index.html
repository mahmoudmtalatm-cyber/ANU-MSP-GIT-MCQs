<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GIT Parasitology Quiz</title>
  <link rel="icon" href="logo.ico" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-main:       #EAF4FB;
      --bg-card:       #FFFFFF;
      --accent:        #1B8AC4;
      --accent-dark:   #136B99;
      --nav-default:   #90CAF9;
      --nav-answered:  #42A5F5;
      --nav-marked:    #E53935;
      --nav-current:   #0D47A1;
      --text-main:     #1A2A3A;
      --text-muted:    #5A7080;
      --correct-bg:    #E8F5E9;
      --correct-fg:    #2E7D32;
      --wrong-bg:      #FFEBEE;
      --wrong-fg:      #C62828;
      --unanswered-bg: #FFF3E0;
      --unanswered-fg: #E65100;
      --font: 'Plus Jakarta Sans', sans-serif;
    }

    html, body {
      height: 100%;
      font-family: var(--font);
      background: var(--bg-main);
      color: var(--text-main);
    }

    /* ── LAYOUT ── */
    #app { display: flex; flex-direction: column; min-height: 100vh; }

    /* ── HEADER ── */
    .header {
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      min-height: 60px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(27,138,196,.3);
    }
    .header-title { font-size: 1.25rem; font-weight: 800; letter-spacing: -.3px; }
    .header-title span { font-size: 1.4rem; }
    .timer {
      font-size: 1.3rem; font-weight: 800;
      color: #FFE082;
      font-variant-numeric: tabular-nums;
      letter-spacing: 2px;
      transition: color .3s;
    }
    .timer.urgent { color: #FF5252; animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }

    /* ── HOME SCREEN ── */
    #home { flex: 1; display: flex; flex-direction: column; }
    .home-hero {
      background: var(--accent);
      text-align: center;
      padding: 36px 20px 44px;
      color: white;
    }
    .home-hero h1 { font-size: 2rem; font-weight: 800; letter-spacing: -.5px; }
    .home-hero p { font-size: 1rem; opacity: .85; margin-top: 6px; }

    .home-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 20px;
      gap: 24px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid #B0D4F0;
      border-radius: 14px;
      padding: 32px 36px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 4px 20px rgba(27,138,196,.1);
    }

    .field-label {
      font-size: .88rem; font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .8px;
      margin-bottom: 8px;
    }

    select, input[type="number"] {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #B0D4F0;
      border-radius: 8px;
      font-family: var(--font);
      font-size: 1rem;
      color: var(--text-main);
      background: #F7FBFF;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      appearance: none;
      -webkit-appearance: none;
    }
    select:focus, input[type="number"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(27,138,196,.15);
    }
    .select-wrapper { position: relative; }
    .select-wrapper::after {
      content: '▾';
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      color: var(--accent); pointer-events: none; font-size: 1.1rem;
    }

    .field-group { margin-bottom: 20px; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      border: none; border-radius: 8px; cursor: pointer;
      font-family: var(--font); font-weight: 700;
      transition: filter .15s, transform .1s, background .15s;
      white-space: nowrap;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn:active { transform: scale(.97); }

    .btn-primary {
      background: var(--accent); color: white;
      padding: 14px 24px; font-size: 1.05rem;
      width: 100%;
    }
    .btn-primary:hover { background: var(--accent-dark); }

    /* Legend */
    .legend {
      display: flex; align-items: center; justify-content: center;
      gap: 6px; flex-wrap: wrap;
    }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: .85rem; color: var(--text-muted); }
    .legend-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }

    /* ── QUIZ SCREEN ── */
    #quiz { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .quiz-body { flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 16px 24px 12px; gap: 12px; }

    .q-card {
      background: var(--bg-card);
      border: 1px solid #B0D4F0;
      border-radius: 12px;
      padding: 24px 28px 20px;
      box-shadow: 0 2px 12px rgba(27,138,196,.08);
      flex-shrink: 0;
    }

    .q-number {
      font-size: .82rem; font-weight: 700; color: var(--accent);
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px;
    }

    .q-text {
      font-size: 1.05rem; font-weight: 600; line-height: 1.55;
      color: var(--text-main); margin-bottom: 18px;
    }

    .options-list { display: flex; flex-direction: column; gap: 8px; }

    .option-label {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 12px 16px; border-radius: 8px;
      border: 1.5px solid #D8EAF7;
      cursor: pointer; transition: background .15s, border-color .15s;
      font-size: .97rem; line-height: 1.45; font-weight: 500;
      color: var(--text-main);
    }
    .option-label:hover { background: #EEF7FF; border-color: var(--nav-answered); }
    .option-label input[type="radio"] { display: none; }
    .option-label.selected {
      background: #DDF0FF; border-color: var(--accent);
    }
    .opt-key {
      font-weight: 800; color: var(--accent);
      min-width: 20px; padding-top: 1px;
    }

    /* ── ACTION BAR ── */
    .action-bar {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; flex-wrap: wrap;
      padding: 6px 0;
      flex-shrink: 0;
    }

    .btn-nav { padding: 10px 18px; font-size: .9rem; border-radius: 8px; }
    .btn-prev { background: #78909C; color: white; }
    .btn-mark { background: var(--nav-marked); color: white; }
    .btn-mark.is-marked { background: #7E1010; }
    .btn-next { background: var(--accent); color: white; }
    .btn-submit { background: #2E7D32; color: white; }

    /* ── NAVIGATOR ── */
    .navigator-wrap {
      flex-shrink: 0;
      background: var(--bg-card);
      border: 1px solid #B0D4F0;
      border-radius: 10px;
      padding: 10px 14px;
    }
    .nav-label { font-size: .78rem; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .8px; }
    .nav-grid { display: flex; flex-wrap: wrap; gap: 5px; }
    .nav-btn {
      width: 34px; height: 34px;
      border: none; border-radius: 6px;
      font-family: var(--font); font-size: .8rem; font-weight: 700;
      cursor: pointer; transition: filter .15s, transform .1s;
      color: white;
    }
    .nav-btn:hover { filter: brightness(1.1); transform: scale(1.05); }
    .nav-btn.state-default { background: var(--nav-default); color: var(--text-main); }
    .nav-btn.state-answered { background: var(--nav-answered); }
    .nav-btn.state-marked { background: var(--nav-marked); }
    .nav-btn.state-current { background: var(--nav-current); }

    /* ── RESULTS SCREEN ── */
    #results { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .results-header {
      background: var(--accent); display: flex;
      align-items: center; justify-content: space-between;
      padding: 14px 28px; flex-shrink: 0;
    }
    .results-title { font-size: 1.3rem; font-weight: 800; color: white; }
    .results-score-badge {
      font-size: 1.1rem; font-weight: 800;
      padding: 6px 18px; border-radius: 8px; color: var(--text-main);
    }

    .results-body { flex: 1; overflow-y: auto; padding: 16px 24px; display: flex; flex-direction: column; gap: 12px; }

    .r-card {
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.07);
      border: 1px solid transparent;
    }
    .r-card.correct { background: var(--correct-bg); border-color: var(--correct-fg); }
    .r-card.wrong    { background: var(--wrong-bg);   border-color: var(--wrong-fg); }
    .r-card.unanswered { background: var(--unanswered-bg); border-color: var(--unanswered-fg); }

    .r-card-inner { display: flex; }
    .r-strip { width: 6px; flex-shrink: 0; }
    .r-content { flex: 1; padding: 14px 18px; }

    .r-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .r-qnum { font-weight: 800; font-size: .9rem; color: var(--text-main); }
    .r-status { font-size: .85rem; font-weight: 700; }
    .r-status.correct { color: var(--correct-fg); }
    .r-status.wrong   { color: var(--wrong-fg); }
    .r-status.unanswered { color: var(--unanswered-fg); }

    .r-question { font-size: .95rem; font-weight: 600; color: var(--text-main); line-height: 1.5; margin-bottom: 10px; }

    .r-option {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 8px 12px; border-radius: 6px;
      font-size: .9rem; font-weight: 500; line-height: 1.4;
      margin-bottom: 4px;
    }
    .r-opt-pfx { font-weight: 800; min-width: 18px; }

    .results-footer { padding: 12px 24px; flex-shrink: 0; display: flex; justify-content: center; }
    .btn-home { background: var(--accent); color: white; padding: 12px 32px; font-size: 1rem; border-radius: 8px; }

    /* ── UTILS ── */
    .hidden { display: none !important; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #B0D4F0; border-radius: 3px; }

    /* Mobile tweaks */
    @media (max-width: 600px) {
      .card { padding: 22px 18px; }
      .quiz-body { padding: 12px 14px 8px; gap: 8px; }
      .q-card { padding: 16px 14px; }
      .q-text { font-size: .97rem; }
      .option-label { font-size: .9rem; padding: 10px 12px; }
      .results-header { padding: 12px 16px; }
      .results-body { padding: 12px 14px; }
      .r-content { padding: 12px 14px; }
      .header-title { font-size: 1rem; }
      .home-hero h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
<div id="app">

  <!-- ══════════════════════════════════════════════
       HOME SCREEN
  ══════════════════════════════════════════════ -->
  <div id="home">
    <div class="home-hero">
      <h1>🧫&nbsp; GIT Parasitology Quiz</h1>
      <p>Select a lecture, set your time, and test your knowledge</p>
    </div>
    <div class="home-body">
      <div class="card">
        <div class="field-group">
          <div class="field-label">Select Lecture</div>
          <div class="select-wrapper">
            <select id="lectureSelect">
              <option value="">— Choose a lecture —</option>
            </select>
          </div>
        </div>
        <div class="field-group">
          <div class="field-label">Quiz Duration (minutes)</div>
          <input type="number" id="timeInput" value="10" min="1" max="120" />
        </div>
        <button class="btn btn-primary" onclick="startQuiz()">▶&nbsp; Start Quiz</button>
      </div>

      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:var(--nav-answered)"></div> Answered</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--nav-marked)"></div> Marked</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--nav-current)"></div> Current</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--nav-default)"></div> Unanswered</div>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════
       QUIZ SCREEN
  ══════════════════════════════════════════════ -->
  <div id="quiz" class="hidden">
    <div class="header">
      <div class="header-title"><span>🧫</span>&nbsp; GIT Parasitology Quiz</div>
      <div class="timer" id="timerDisplay">00:00</div>
    </div>
    <div class="quiz-body">
      <div class="q-card">
        <div class="q-number" id="qNumber">Q1 / 16</div>
        <div class="q-text" id="qText"></div>
        <div class="options-list" id="optionsList"></div>
      </div>

      <div class="action-bar">
        <button class="btn btn-nav btn-prev" onclick="prevQ()">◀&nbsp; Previous</button>
        <button class="btn btn-nav btn-mark" id="markBtn" onclick="toggleMark()">🔴&nbsp; Mark / Unmark</button>
        <button class="btn btn-nav btn-next" onclick="nextQ()">Next&nbsp; ▶</button>
        <button class="btn btn-nav btn-submit" onclick="confirmSubmit()">✔&nbsp; Submit</button>
      </div>

      <div class="navigator-wrap">
        <div class="nav-label">Questions Navigator</div>
        <div class="nav-grid" id="navGrid"></div>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════
       RESULTS SCREEN
  ══════════════════════════════════════════════ -->
  <div id="results" class="hidden">
    <div class="results-header">
      <div class="results-title" id="resultsTitle">📝&nbsp; Quiz Results</div>
      <div class="results-score-badge" id="scoreBadge"></div>
    </div>
    <div class="results-body" id="resultsBody"></div>
    <div class="results-footer">
      <button class="btn btn-home" onclick="goHome()">⟵&nbsp; Back to Home</button>
    </div>
  </div>

</div>

<script>
/* ══════════════════════════════════════════════════════════
   LECTURE DATA
══════════════════════════════════════════════════════════ */
const lectures = {
  "Lecture 1 - Ascaris lumbricoides": [
    {question:"A patient with ascariasis experiences a cough and wheezing. This symptom is most likely due to which stage of the Ascaris life cycle?",options:{A:"Eggs",B:"Adult worms",C:"Larvae"},answer:"C"},
    {question:"After Ascaris eggs hatch in the small intestine, what path do the larvae take to the lungs?",options:{A:"Through the lymphatic system",B:"Through the bloodstream",C:"Directly through tissue penetration"},answer:"B"},
    {question:"What is the correct sequence of Ascaris lumbricoides lifecycle stages after humans ingest infective eggs?",options:{A:"Eggs hatch into larvae, larvae migrate to lungs, then to intestines",B:"Larvae mature into adults in intestine then adults migrate to lungs",C:"Eggs hatch larvae in the soil before human ingestion"},answer:"A"},
    {question:"Why does Ascaris infection often lead to malnutrition, especially in children?",options:{A:"The worms produce toxins that destroy nutrients",B:"The worms cause allergic reactions to food",C:"The worms compete with the host for nutrients"},answer:"C"},
    {question:"Which of the following is NOT a predisposing factor for Ascaris migration?",options:{A:"Fever",B:"Diarrhea",C:"Spicy food",D:"Anesthesia"},answer:"B"},
    {question:"Which patient's symptom suggests infection by adult Ascaris worms?",options:{A:"The patient with a persistent cough",B:"The patient with abdominal pain",C:"Neither patient's symptoms are linked to Ascaris",D:"Both patients show signs of adult Ascaris"},answer:"B"},
    {question:"What is the primary method for diagnosing ascariasis?",options:{A:"X-ray imaging of the lungs",B:"Blood picture analysis",C:"Microscopic examination of stool samples",D:"Urine analysis"},answer:"C"},
    {question:"In a community with high rates of ascariasis, which measure would be most effective for reducing new infections?",options:{A:"Improving sanitation systems for waste disposal",B:"Providing medication to all infected individuals",C:"Encouraging more outdoor activities for children",D:"Educating children about proper cooking methods"},answer:"A"},
    {question:"What is the diagnostic stage of intestinal ascariasis?",options:{A:"Mature egg",B:"Fertilized egg",C:"Larva"},answer:"B"},
    {question:"Which of the following is a complication of Ascaris infection?",options:{A:"Peritonitis",B:"Rectal prolapse",C:"Anemia"},answer:"A"},
    {question:"What is the infective stage of ascariasis?",options:{A:"Mature egg",B:"Fertilized egg",C:"Larva"},answer:"A"},
    {question:"What is the type of vitamin deficiency with ascariasis?",options:{A:"Vitamin D",B:"Vitamin A",C:"Vitamin K",D:"Vitamin E"},answer:"B"},
    {question:"How can man get infected with Ascaris?",options:{A:"Penetration of the skin",B:"Autoinfection by the eggs",C:"Ingestion of eggs from contaminated hands",D:"Inhalation of eggs"},answer:"C"},
    {question:"What is the cause of Ascaris pneumonitis?",options:{A:"Larval migration",B:"Wandering adults",C:"Ectopic egg deposition"},answer:"A"},
    {question:"Why do Urticaria and fever happen in intestinal ascariasis?",options:{A:"Secretory egg antigens",B:"Metabolite, Ascaron",C:"Degenerated worm cuticle"},answer:"B"},
    {question:"What can diagnose Loeffler's syndrome?",options:{A:"Pleural effusion and lung consolidation",B:"Transient pulmonary infiltration by X-ray",C:"Adult worms expelled from the nose"},answer:"B"},
  ],
  "Lecture 2 - Strongyloides stercoralis": [
    {question:"What is a key risk factor for Strongyloides infection in individuals?",options:{A:"Living in tropical regions",B:"Consuming contaminated food",C:"Having a strong immune system",D:"Regularly exercising outdoors"},answer:"A"},
    {question:"What kind of climate provides the ideal conditions for Strongyloides larvae to survive in the soil?",options:{A:"Dry and cold",B:"Hot and very dry",C:"Warm and moist",D:"Cool and frozen"},answer:"C"},
    {question:"Which population is at the highest risk for severe manifestations of Strongyloides infection?",options:{A:"Healthy adults with no prior health issues",B:"Immunocompromised individuals",C:"Children under five years old",D:"Elderly individuals"},answer:"B"},
    {question:"A patient exhibits both respiratory symptoms and later gastrointestinal issues during a Strongyloides infection. How do the causative agents for these two symptom phases primarily differ?",options:{A:"Both are caused by rhabditiform larvae",B:"Respiratory symptoms are from adult worms; intestinal issues are from larvae",C:"Both are caused by filariform larvae",D:"Respiratory symptoms are from larval migration; intestinal issues are from adult worms"},answer:"D"},
    {question:"In strongyloidiasis, what is the most accurate description of 'Hyperinfection'?",options:{A:"An initial localized skin inflammation",B:"A widespread infection affecting multiple organs",C:"Larvae migrating from the lungs to the throat",D:"Persistent allergic asthma"},answer:"B"},
    {question:"Which action is most practical for people to apply daily to prevent Strongyloides infection?",options:{A:"Avoid contact with farm animals",B:"Drink only bottled water",C:"Take prophylactic medication",D:"Wear shoes and use proper toilets"},answer:"D"},
    {question:"What is the diagnostic stage of intestinal strongyloidiasis?",options:{A:"Mature egg",B:"Rhabditiform larva",C:"Filariform larva",D:"Rhabditiform or filariform larva"},answer:"B"},
    {question:"Which of the following is the cause of death in strongyloidiasis?",options:{A:"Disseminated infection",B:"Rectal prolapse",C:"Iron deficiency anemia"},answer:"A"},
    {question:"What is the infective stage of strongyloidiasis?",options:{A:"Mature egg",B:"Fertilized egg",C:"Filariform larva",D:"Rhabditiform larva"},answer:"C"},
    {question:"How can man get infected with Strongyloides?",options:{A:"Penetration of the skin",B:"Ingestion of eggs from contaminated hands",C:"Inhalation of eggs"},answer:"A"},
    {question:"What is the cause of larva currens?",options:{A:"Internal autoinfection",B:"External autoinfection",C:"Heteroinfection"},answer:"B"},
    {question:"What is the type of vitamin deficiency with intestinal strongyloidiasis?",options:{A:"Vitamin A",B:"Vitamin B12",C:"Vitamin E"},answer:"B"},
    {question:"Which technique depends on the hydrophilic nature of the nematode larvae?",options:{A:"Sedimentation technique",B:"Baermann's technique",C:"Entero-capsule test"},answer:"B"},
    {question:"When do you have to exclude strongyloidiasis?",options:{A:"Before chemotherapy",B:"In concomitant Ascaris infection",C:"Before starting antibiotics"},answer:"A"},
  ],
  "Lecture 3 - Ancylostoma and Heterophyes": [
    {question:"After skin penetration, what is the next step in the hookworm larvae migration?",options:{A:"To the kidney",B:"To the lungs",C:"To the liver",D:"Directly to the intestines"},answer:"B"},
    {question:"Which statement best describes the pulmonary phase of hookworm disease?",options:{A:"Chronic inflammation leads to stunted growth",B:"Larvae cause severe skin lesions",C:"Larvae migrate through the lungs, causing respiratory symptoms",D:"Adult worms feed on blood in the intestines"},answer:"C"},
    {question:"What is the scientific name for the skin reaction experienced when hookworm larvae penetrate the skin?",options:{A:"Larvae bite",B:"Larvae eczema",C:"Ground abscess",D:"Ground itch"},answer:"D"},
    {question:"What is the primary health problem caused by Ancylostoma duodenale feeding habits?",options:{A:"Bacterial infections of the gut",B:"Severe allergic reactions",C:"High blood pressure",D:"Anemia due to blood loss"},answer:"D"},
    {question:"What is a significant consequence of Ancylostoma duodenale infections in children?",options:{A:"Impaired cognitive development",B:"Increased blood pressure",C:"Autoimmune responses",D:"Impaired renal functions"},answer:"A"},
    {question:"Given the information about Ancylostoma duodenale, what can be implied about public health efforts in affected regions?",options:{A:"Hookworm infections primarily decrease through boiling water",B:"A combination of proper sanitation and health education is crucial",C:"Medical treatment is the only effective solution",D:"Education on hygiene is less important than medication"},answer:"B"},
    {question:"A community leader suggests that avoiding raw vegetables will prevent hookworm disease. Why is this advice insufficient for prevention?",options:{A:"Hookworms are spread by mosquito bites",B:"Hookworms are transmitted through raw fish",C:"Hookworms are transmitted through skin penetration by larvae",D:"Hookworms are only transmitted through raw meat"},answer:"C"},
    {question:"To effectively reduce chronic hookworm infections in a school-aged population, what comprehensive intervention plan would you propose?",options:{A:"Only provide iron supplements to all children",B:"Implement regular deworming, promote shoe-wearing",C:"Educate only parents about the disease",D:"Focus solely on treating symptomatic children"},answer:"B"},
    {question:"What is the diagnostic stage of hookworm disease?",options:{A:"Mature egg",B:"Fertilized egg",C:"Filariform larva",D:"Rhabditiform larva"},answer:"B"},
    {question:"Which of the following is a complication of hookworm disease?",options:{A:"Severe diarrhea",B:"Disseminated infection",C:"Delayed child development"},answer:"C"},
    {question:"What is the infective stage of hookworm disease?",options:{A:"Mature egg",B:"Fertilized egg",C:"Filariform larva",D:"Rhabditiform larva"},answer:"C"},
    {question:"How can man get infected with Ancylostoma duodenale?",options:{A:"Penetration of the skin",B:"Ingestion of eggs",C:"Inhalation of eggs"},answer:"A"},
    {question:"What is the cause of ground itch?",options:{A:"Internal autoinfection",B:"External autoinfection",C:"Heteroinfection"},answer:"C"},
    {question:"What is the type of anemia in hookworm disease?",options:{A:"Microcytic hypochromic",B:"Megaloblastic",C:"Pernicious"},answer:"A"},
    {question:"Which technique can be used to detect the intensity of intestinal helminthiasis?",options:{A:"Stoll's technique",B:"Baermann's technique",C:"Stool culture"},answer:"A"},
    {question:"Who are at risk to catch ancylostomiasis?",options:{A:"Fishermen",B:"Farmers",C:"Immunosuppressed"},answer:"B"},

    {question:"What is the complication of osseous hydatid cyst?",options:{A:"Sensory deficits",B:"Motor deficits",C:"Pathological fractures"},answer:"C"},
    {question:"What is the main diagnostic technique in hydatid disease?",options:{A:"Imaging",B:"PAIR",C:"ELISA"},answer:"A"},
    {question:"What is the hydatid sand?",options:{A:"Eggs of Echinococcus",B:"Free scolices of Echinococcus",C:"Free brood capsules",D:"Free brood capsules, scolices and daughter cysts"},answer:"D"},
    {question:"What is the main treatment of 3cm solitary hydatid cyst, in the liver?",options:{A:"Cystectomy",B:"Albendazole",C:"PAIR",D:"Cystectomy and albendazole"},answer:"D"},
  ],
};

/* ══════════════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════════════ */
let currentQuestions = [];
let currentIndex     = 0;
let userAnswers      = {};   // {index: "A"|"B"|...}
let markedSet        = new Set();
let timeLeft         = 0;
let timerInterval    = null;

/* ══════════════════════════════════════════════════════════
   INIT — populate lecture select
══════════════════════════════════════════════════════════ */
(function init() {
  const sel = document.getElementById('lectureSelect');
  Object.keys(lectures).forEach(name => {
    const opt = document.createElement('option');
    opt.value = name; opt.textContent = name;
    sel.appendChild(opt);
  });
})();

/* ══════════════════════════════════════════════════════════
   SCREEN SWITCHING
══════════════════════════════════════════════════════════ */
function showScreen(id) {
  ['home','quiz','results'].forEach(s => {
    document.getElementById(s).classList.toggle('hidden', s !== id);
  });
}

/* ══════════════════════════════════════════════════════════
   HOME → START
══════════════════════════════════════════════════════════ */
function startQuiz() {
  const lec  = document.getElementById('lectureSelect').value;
  const mins = parseInt(document.getElementById('timeInput').value, 10);

  if (!lec)             return alert('Please choose a lecture first.');
  if (!mins || mins<=0) return alert('Please enter a valid duration in minutes.');

  currentQuestions = lectures[lec];
  currentIndex     = 0;
  userAnswers      = {};
  markedSet        = new Set();
  timeLeft         = mins * 60;

  showScreen('quiz');
  renderQuestion();
  startTimer();
}

/* ══════════════════════════════════════════════════════════
   TIMER
══════════════════════════════════════════════════════════ */
function startTimer() {
  stopTimer();
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    timeLeft--;
    if (timeLeft <= 0) { timeLeft = 0; updateTimerDisplay(); stopTimer(); submitQuiz(); }
    else { updateTimerDisplay(); }
  }, 1000);
}
function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}
function updateTimerDisplay() {
  const m = String(Math.floor(timeLeft/60)).padStart(2,'0');
  const s = String(timeLeft%60).padStart(2,'0');
  const el = document.getElementById('timerDisplay');
  el.textContent = `${m}:${s}`;
  el.classList.toggle('urgent', timeLeft <= 60);
}

/* ══════════════════════════════════════════════════════════
   RENDER QUESTION
══════════════════════════════════════════════════════════ */
function renderQuestion() {
  const q      = currentQuestions[currentIndex];
  const total  = currentQuestions.length;
  const opts   = Object.entries(q.options);

  document.getElementById('qNumber').textContent = `Q${currentIndex+1} / ${total}`;
  document.getElementById('qText').textContent   = q.question;

  const list = document.getElementById('optionsList');
  list.innerHTML = '';

  opts.forEach(([key, val]) => {
    const saved = userAnswers[currentIndex] || '';
    const label = document.createElement('label');
    label.className = 'option-label' + (saved === key ? ' selected' : '');

    label.innerHTML = `
      <input type="radio" name="q${currentIndex}" value="${key}" ${saved===key?'checked':''} />
      <span class="opt-key">${key}.</span>
      <span>${val}</span>
    `;
    label.addEventListener('click', () => selectAnswer(key));
    list.appendChild(label);
  });

  updateMarkBtn();
  renderNavigator();
}

function selectAnswer(key) {
  userAnswers[currentIndex] = key;
  document.querySelectorAll('.option-label').forEach(lbl => {
    const inp = lbl.querySelector('input');
    lbl.classList.toggle('selected', inp.value === key);
  });
  renderNavigator();
}

/* ══════════════════════════════════════════════════════════
   NAVIGATOR
══════════════════════════════════════════════════════════ */
function renderNavigator() {
  const grid = document.getElementById('navGrid');
  grid.innerHTML = '';
  currentQuestions.forEach((_, i) => {
    const btn = document.createElement('button');
    btn.className = 'nav-btn ' + navState(i);
    btn.textContent = i + 1;
    btn.onclick = () => goTo(i);
    grid.appendChild(btn);
  });
}
function navState(i) {
  if (i === currentIndex)  return 'state-current';
  if (markedSet.has(i))    return 'state-marked';
  if (userAnswers[i])      return 'state-answered';
  return 'state-default';
}

/* ══════════════════════════════════════════════════════════
   NAVIGATION
══════════════════════════════════════════════════════════ */
function goTo(i) {
  currentIndex = i;
  renderQuestion();
}
function prevQ() {
  if (currentIndex > 0) goTo(currentIndex - 1);
}
function nextQ() {
  if (currentIndex < currentQuestions.length - 1) goTo(currentIndex + 1);
}

/* ══════════════════════════════════════════════════════════
   MARK
══════════════════════════════════════════════════════════ */
function toggleMark() {
  if (markedSet.has(currentIndex)) markedSet.delete(currentIndex);
  else markedSet.add(currentIndex);
  updateMarkBtn();
  renderNavigator();
}
function updateMarkBtn() {
  const btn = document.getElementById('markBtn');
  btn.classList.toggle('is-marked', markedSet.has(currentIndex));
  btn.textContent = markedSet.has(currentIndex) ? '🔴 Unmark' : '🔴 Mark / Unmark';
}

/* ══════════════════════════════════════════════════════════
   SUBMIT
══════════════════════════════════════════════════════════ */
function confirmSubmit() {
  const unanswered = currentQuestions.length - Object.keys(userAnswers).length;
  if (unanswered > 0) {
    if (!confirm(`You still have ${unanswered} unanswered question(s). Submit anyway?`)) return;
  }
  submitQuiz();
}

function submitQuiz() {
  stopTimer();
  const total  = currentQuestions.length;
  let   score  = 0;
  currentQuestions.forEach((q, i) => {
    if (userAnswers[i] === q.answer) score++;
  });

  const pct = Math.round(score / total * 100);
  const emoji = pct === 100 ? '🏆' : pct >= 70 ? '🎉' : '📝';

  document.getElementById('resultsTitle').textContent = `${emoji}  Quiz Results`;
  const badge = document.getElementById('scoreBadge');
  badge.textContent = `${score} / ${total}  (${pct}%)`;
  badge.style.background = pct >= 70 ? '#A5D6A7' : '#FFCDD2';

  buildResults(score, total);
  showScreen('results');
}

function buildResults(score, total) {
  const body = document.getElementById('resultsBody');
  body.innerHTML = '';

  currentQuestions.forEach((q, i) => {
    const userAns  = userAnswers[i] || '';
    const correct  = q.answer;
    const isOk     = userAns === correct;
    const isUnansw = userAns === '';
    const isMark   = markedSet.has(i);

    let cls, statusText, statusClass, stripColor;
    if (isOk) {
      cls='correct'; statusText='✔  Correct';    statusClass='correct'; stripColor='var(--correct-fg)';
    } else if (isUnansw) {
      cls='unanswered'; statusText='—  Not answered'; statusClass='unanswered'; stripColor='var(--unanswered-fg)';
    } else {
      cls='wrong'; statusText='✘  Incorrect';   statusClass='wrong';   stripColor='var(--wrong-fg)';
    }

    const card = document.createElement('div');
    card.className = `r-card ${cls}`;
    card.innerHTML = `
      <div class="r-card-inner">
        <div class="r-strip" style="background:${stripColor}"></div>
        <div class="r-content">
          <div class="r-card-header">
            <div class="r-qnum">Q${i+1}${isMark?' &nbsp;🔴 Marked':''}</div>
            <div class="r-status ${statusClass}">${statusText}</div>
          </div>
          <div class="r-question">${q.question}</div>
          <div class="r-options"></div>
        </div>
      </div>
    `;

    const optsDiv = card.querySelector('.r-options');
    Object.entries(q.options).forEach(([key, val]) => {
      const isCorrectOpt = key === correct;
      const isUserOpt    = key === userAns;

      let bg='', fg='', pfx='';
      if (isCorrectOpt) { bg='#C8E6C9'; fg='#1B5E20'; pfx='✔'; }
      else if (isUserOpt) { bg='#FFCDD2'; fg='#B71C1C'; pfx='✘'; }

      const row = document.createElement('div');
      row.className = 'r-option';
      if (bg) { row.style.background=bg; row.style.border=`1px solid ${fg}`; row.style.borderRadius='6px'; }
      row.innerHTML = `<span class="r-opt-pfx" style="color:${fg||'var(--text-muted)'}">${pfx||' '}</span><strong style="color:${fg||'var(--text-muted)'};min-width:20px">${key}.</strong><span style="color:${fg||'var(--text-muted)'};${isCorrectOpt||isUserOpt?'font-weight:600':''}">${val}</span>`;
      optsDiv.appendChild(row);
    });

    body.appendChild(card);
  });
}

/* ══════════════════════════════════════════════════════════
   BACK TO HOME
══════════════════════════════════════════════════════════ */
function goHome() {
  stopTimer();
  showScreen('home');
}
</script>
</body>
</html>
