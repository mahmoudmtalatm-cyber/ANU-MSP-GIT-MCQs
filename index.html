<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GIT Parasitology Quiz</title>
  <link rel="icon" href="logo.ico" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-main:       #EAF4FB;
      --bg-card:       #FFFFFF;
      --accent:        #1B8AC4;
      --accent-dark:   #136B99;
      --nav-default:   #90CAF9;
      --nav-answered:  #42A5F5;
      --nav-marked:    #E53935;
      --nav-current:   #0D47A1;
      --text-main:     #1A2A3A;
      --text-muted:    #5A7080;
      --correct-bg:    #E8F5E9;
      --correct-fg:    #2E7D32;
      --wrong-bg:      #FFEBEE;
      --wrong-fg:      #C62828;
      --unanswered-bg: #FFF3E0;
      --unanswered-fg: #E65100;
      --font: 'Plus Jakarta Sans', sans-serif;
    }

    html, body {
      height: 100%;
      font-family: var(--font);
      background: var(--bg-main);
      color: var(--text-main);
    }

    /* ── LAYOUT ── */
    #app { display: flex; flex-direction: column; min-height: 100vh; }

    /* ── HEADER ── */
    .header {
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      min-height: 60px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(27,138,196,.3);
    }
    .header-title { font-size: 1.25rem; font-weight: 800; letter-spacing: -.3px; }
    .header-title span { font-size: 1.4rem; }
    .timer {
      font-size: 1.3rem; font-weight: 800;
      color: #FFE082;
      font-variant-numeric: tabular-nums;
      letter-spacing: 2px;
      transition: color .3s;
    }
    .timer.urgent { color: #FF5252; animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.6} }

    /* ── HOME SCREEN ── */
    #home { flex: 1; display: flex; flex-direction: column; }
    .home-hero {
      background: var(--accent);
      text-align: center;
      padding: 36px 20px 44px;
      color: white;
    }
    .home-hero h1 { font-size: 2rem; font-weight: 800; letter-spacing: -.5px; }
    .home-hero p { font-size: 1rem; opacity: .85; margin-top: 6px; }

    .home-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 20px;
      gap: 24px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid #B0D4F0;
      border-radius: 14px;
      padding: 32px 36px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 4px 20px rgba(27,138,196,.1);
    }

    .field-label {
      font-size: .88rem; font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .8px;
      margin-bottom: 8px;
    }

    select, input[type="number"] {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #B0D4F0;
      border-radius: 8px;
      font-family: var(--font);
      font-size: 1rem;
      color: var(--text-main);
      background: #F7FBFF;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      appearance: none;
      -webkit-appearance: none;
    }
    select:focus, input[type="number"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(27,138,196,.15);
    }
    .select-wrapper { position: relative; }
    .select-wrapper::after {
      content: '▾';
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      color: var(--accent); pointer-events: none; font-size: 1.1rem;
    }

    .field-group { margin-bottom: 20px; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      border: none; border-radius: 8px; cursor: pointer;
      font-family: var(--font); font-weight: 700;
      transition: filter .15s, transform .1s, background .15s;
      white-space: nowrap;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn:active { transform: scale(.97); }

    .btn-primary {
      background: var(--accent); color: white;
      padding: 14px 24px; font-size: 1.05rem;
      width: 100%;
    }
    .btn-primary:hover { background: var(--accent-dark); }

    /* Legend */
    .legend {
      display: flex; align-items: center; justify-content: center;
      gap: 6px; flex-wrap: wrap;
    }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: .85rem; color: var(--text-muted); }
    .legend-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }

    /* ── QUIZ SCREEN ── */
    #quiz { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .quiz-body { flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 16px 24px 12px; gap: 12px; }

    .q-card {
      background: var(--bg-card);
      border: 1px solid #B0D4F0;
      border-radius: 12px;
      padding: 24px 28px 20px;
      box-shadow: 0 2px 12px rgba(27,138,196,.08);
      flex-shrink: 0;
    }

    .q-number {
      font-size: .82rem; font-weight: 700; color: var(--accent);
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px;
    }

    .q-text {
      font-size: 1.05rem; font-weight: 600; line-height: 1.55;
      color: var(--text-main); margin-bottom: 18px;
    }

    .options-list { display: flex; flex-direction: column; gap: 8px; }

    .option-label {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 12px 16px; border-radius: 8px;
      border: 1.5px solid #D8EAF7;
      cursor: pointer; transition: background .15s, border-color .15s;
      font-size: .97rem; line-height: 1.45; font-weight: 500;
      color: var(--text-main);
    }
    .option-label:hover { background: #EEF7FF; border-color: var(--nav-answered); }
    .option-label input[type="radio"] { display: none; }
    .option-label.selected {
      background: #DDF0FF; border-color: var(--accent);
    }
    .opt-key {
      font-weight: 800; color: var(--accent);
      min-width: 20px; padding-top: 1px;
    }

    /* ── ACTION BAR ── */
    .action-bar {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; flex-wrap: wrap;
      padding: 6px 0;
      flex-shrink: 0;
    }

    .btn-nav { padding: 10px 18px; font-size: .9rem; border-radius: 8px; }
    .btn-prev { background: #78909C; color: white; }
    .btn-mark { background: var(--nav-marked); color: white; }
    .btn-mark.is-marked { background: #7E1010; }
    .btn-next { background: var(--accent); color: white; }
    .btn-submit { background: #2E7D32; color: white; }

    /* ── NAVIGATOR ── */
    .navigator-wrap {
      flex-shrink: 0;
      background: var(--bg-card);
      border: 1px solid #B0D4F0;
      border-radius: 10px;
      padding: 10px 14px;
    }
    .nav-label { font-size: .78rem; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .8px; }
    .nav-grid { display: flex; flex-wrap: wrap; gap: 5px; }
    .nav-btn {
      width: 34px; height: 34px;
      border: none; border-radius: 6px;
      font-family: var(--font); font-size: .8rem; font-weight: 700;
      cursor: pointer; transition: filter .15s, transform .1s;
      color: white;
    }
    .nav-btn:hover { filter: brightness(1.1); transform: scale(1.05); }
    .nav-btn.state-default { background: var(--nav-default); color: var(--text-main); }
    .nav-btn.state-answered { background: var(--nav-answered); }
    .nav-btn.state-marked { background: var(--nav-marked); }
    .nav-btn.state-current { background: var(--nav-current); }

    /* ── RESULTS SCREEN ── */
    #results { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .results-header {
      background: var(--accent); display: flex;
      align-items: center; justify-content: space-between;
      padding: 14px 28px; flex-shrink: 0;
    }
    .results-title { font-size: 1.3rem; font-weight: 800; color: white; }
    .results-score-badge {
      font-size: 1.1rem; font-weight: 800;
      padding: 6px 18px; border-radius: 8px; color: var(--text-main);
    }

    .results-body { flex: 1; overflow-y: auto; padding: 16px 24px; display: flex; flex-direction: column; gap: 12px; }

    .r-card {
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.07);
      border: 1px solid transparent;
    }
    .r-card.correct { background: var(--correct-bg); border-color: var(--correct-fg); }
    .r-card.wrong    { background: var(--wrong-bg);   border-color: var(--wrong-fg); }
    .r-card.unanswered { background: var(--unanswered-bg); border-color: var(--unanswered-fg); }

    .r-card-inner { display: flex; }
    .r-strip { width: 6px; flex-shrink: 0; }
    .r-content { flex: 1; padding: 14px 18px; }

    .r-card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .r-qnum { font-weight: 800; font-size: .9rem; color: var(--text-main); }
    .r-status { font-size: .85rem; font-weight: 700; }
    .r-status.correct { color: var(--correct-fg); }
    .r-status.wrong   { color: var(--wrong-fg); }
    .r-status.unanswered { color: var(--unanswered-fg); }

    .r-question { font-size: .95rem; font-weight: 600; color: var(--text-main); line-height: 1.5; margin-bottom: 10px; }

    .r-option {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 8px 12px; border-radius: 6px;
      font-size: .9rem; font-weight: 500; line-height: 1.4;
      margin-bottom: 4px;
    }
    .r-opt-pfx { font-weight: 800; min-width: 18px; }

    .results-footer { padding: 12px 24px; flex-shrink: 0; display: flex; justify-content: center; }
    .btn-home { background: var(--accent); color: white; padding: 12px 32px; font-size: 1rem; border-radius: 8px; }

    /* ── UTILS ── */
    .hidden { display: none !important; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #B0D4F0; border-radius: 3px; }

    /* Mobile tweaks */
    @media (max-width: 600px) {
      .card { padding: 22px 18px; }
      .quiz-body { padding: 12px 14px 8px; gap: 8px; }
      .q-card { padding: 16px 14px; }
      .q-text { font-size: .97rem; }
      .option-label { font-size: .9rem; padding: 10px 12px; }
      .results-header { padding: 12px 16px; }
      .results-body { padding: 12px 14px; }
      .r-content { padding: 12px 14px; }
      .header-title { font-size: 1rem; }
      .home-hero h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
<div id="app">

  <!-- ══════════════════════════════════════════════
       HOME SCREEN
  ══════════════════════════════════════════════ -->
  <div id="home">
    <div class="home-hero">
      <h1>🧫&nbsp; GIT Parasitology Quiz</h1>
      <p>Select a lecture, set your time, and test your knowledge</p>
    </div>
    <div class="home-body">
      <div class="card">
        <div class="field-group">
          <div class="field-label">Select Lecture</div>
          <div class="select-wrapper">
            <select id="lectureSelect">
              <option value="">— Choose a lecture —</option>
            </select>
          </div>
        </div>
        <div class="field-group">
          <div class="field-label">Quiz Duration (minutes)</div>
          <input type="number" id="timeInput" value="10" min="1" max="120" />
        </div>
        <button class="btn btn-primary" onclick="startQuiz()">▶&nbsp; Start Quiz</button>
      </div>

      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:var(--nav-answered)"></div> Answered</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--nav-marked)"></div> Marked</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--nav-current)"></div> Current</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--nav-default)"></div> Unanswered</div>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════
       QUIZ SCREEN
  ══════════════════════════════════════════════ -->
  <div id="quiz" class="hidden">
    <div class="header">
      <div class="header-title"><span>🧫</span>&nbsp; GIT Parasitology Quiz</div>
      <div class="timer" id="timerDisplay">00:00</div>
    </div>
    <div class="quiz-body">
      <div class="q-card">
        <div class="q-number" id="qNumber">Q1 / 16</div>
        <div class="q-text" id="qText"></div>
        <div class="options-list" id="optionsList"></div>
      </div>

      <div class="action-bar">
        <button class="btn btn-nav btn-prev" onclick="prevQ()">◀&nbsp; Previous</button>
        <button class="btn btn-nav btn-mark" id="markBtn" onclick="toggleMark()">🔴&nbsp; Mark / Unmark</button>
        <button class="btn btn-nav btn-next" onclick="nextQ()">Next&nbsp; ▶</button>
        <button class="btn btn-nav btn-submit" onclick="confirmSubmit()">✔&nbsp; Submit</button>
      </div>

      <div class="navigator-wrap">
        <div class="nav-label">Questions Navigator</div>
        <div class="nav-grid" id="navGrid"></div>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════════════
       RESULTS SCREEN
  ══════════════════════════════════════════════ -->
  <div id="results" class="hidden">
    <div class="results-header">
      <div class="results-title" id="resultsTitle">📝&nbsp; Quiz Results</div>
      <div class="results-score-badge" id="scoreBadge"></div>
    </div>
    <div class="results-body" id="resultsBody"></div>
    <div class="results-footer">
      <button class="btn btn-home" onclick="goHome()">⟵&nbsp; Back to Home</button>
    </div>
  </div>

</div>

<script>
/* ══════════════════════════════════════════════════════════
   LECTURE DATA
══════════════════════════════════════════════════════════ */
const lectures = {
  "Lecture 1 - Ascaris lumbricoides": [
    {question:"A patient with ascariasis experiences a cough and wheezing. This symptom is most likely due to which stage of the Ascaris life cycle?",options:{A:"Eggs",B:"Adult worms",C:"Larvae"},answer:"C"},
    {question:"After Ascaris eggs hatch in the small intestine, what path do the larvae take to the lungs?",options:{A:"Through the lymphatic system",B:"Through the bloodstream",C:"Directly through tissue penetration"},answer:"B"},
    {question:"What is the correct sequence of Ascaris lumbricoides lifecycle stages after humans ingest infective eggs?",options:{A:"Eggs hatch into larvae, larvae migrate to lungs, then to intestines",B:"Larvae mature into adults in intestine then adults migrate to lungs",C:"Eggs hatch larvae in the soil before human ingestion"},answer:"A"},
    {question:"Why does Ascaris infection often lead to malnutrition, especially in children?",options:{A:"The worms produce toxins that destroy nutrients",B:"The worms cause allergic reactions to food",C:"The worms compete with the host for nutrients"},answer:"C"},
    {question:"Which of the following is NOT a predisposing factor for Ascaris migration?",options:{A:"Fever",B:"Diarrhea",C:"Spicy food",D:"Anesthesia"},answer:"B"},
    {question:"Which patient's symptom suggests infection by adult Ascaris worms?",options:{A:"The patient with a persistent cough",B:"The patient with abdominal pain",C:"Neither patient's symptoms are linked to Ascaris",D:"Both patients show signs of adult Ascaris"},answer:"B"},
    {question:"What is the primary method for diagnosing ascariasis?",options:{A:"X-ray imaging of the lungs",B:"Blood picture analysis",C:"Microscopic examination of stool samples",D:"Urine analysis"},answer:"C"},
    {question:"In a community with high rates of ascariasis, which measure would be most effective for reducing new infections?",options:{A:"Improving sanitation systems for waste disposal",B:"Providing medication to all infected individuals",C:"Encouraging more outdoor activities for children",D:"Educating children about proper cooking methods"},answer:"A"},
    {question:"What is the diagnostic stage of intestinal ascariasis?",options:{A:"Mature egg",B:"Fertilized egg",C:"Larva"},answer:"B"},
    {question:"Which of the following is a complication of Ascaris infection?",options:{A:"Peritonitis",B:"Rectal prolapse",C:"Anemia"},answer:"A"},
    {question:"What is the infective stage of ascariasis?",options:{A:"Mature egg",B:"Fertilized egg",C:"Larva"},answer:"A"},
    {question:"What is the type of vitamin deficiency with ascariasis?",options:{A:"Vitamin D",B:"Vitamin A",C:"Vitamin K",D:"Vitamin E"},answer:"B"},
    {question:"How can man get infected with Ascaris?",options:{A:"Penetration of the skin",B:"Autoinfection by the eggs",C:"Ingestion of eggs from contaminated hands",D:"Inhalation of eggs"},answer:"C"},
    {question:"What is the cause of Ascaris pneumonitis?",options:{A:"Larval migration",B:"Wandering adults",C:"Ectopic egg deposition"},answer:"A"},
    {question:"Why do Urticaria and fever happen in intestinal ascariasis?",options:{A:"Secretory egg antigens",B:"Metabolite, Ascaron",C:"Degenerated worm cuticle"},answer:"B"},
    {question:"What can diagnose Loeffler's syndrome?",options:{A:"Pleural effusion and lung consolidation",B:"Transient pulmonary infiltration by X-ray",C:"Adult worms expelled from the nose"},answer:"B"},
  ],
  "Lecture 2 - Strongyloides stercoralis": [
    {question:"What is a key risk factor for Strongyloides infection in individuals?",options:{A:"Living in tropical regions",B:"Consuming contaminated food",C:"Having a strong immune system",D:"Regularly exercising outdoors"},answer:"A"},
    {question:"What kind of climate provides the ideal conditions for Strongyloides larvae to survive in the soil?",options:{A:"Dry and cold",B:"Hot and very dry",C:"Warm and moist",D:"Cool and frozen"},answer:"C"},
    {question:"Which population is at the highest risk for severe manifestations of Strongyloides infection?",options:{A:"Healthy adults with no prior health issues",B:"Immunocompromised individuals",C:"Children under five years old",D:"Elderly individuals"},answer:"B"},
    {question:"A patient exhibits both respiratory symptoms and later gastrointestinal issues during a Strongyloides infection. How do the causative agents for these two symptom phases primarily differ?",options:{A:"Both are caused by rhabditiform larvae",B:"Respiratory symptoms are from adult worms; intestinal issues are from larvae",C:"Both are caused by filariform larvae",D:"Respiratory symptoms are from larval migration; intestinal issues are from adult worms"},answer:"D"},
    {question:"In strongyloidiasis, what is the most accurate description of 'Hyperinfection'?",options:{A:"An initial localized skin inflammation",B:"A widespread infection affecting multiple organs",C:"Larvae migrating from the lungs to the throat",D:"Persistent allergic asthma"},answer:"B"},
    {question:"Which action is most practical for people to apply daily to prevent Strongyloides infection?",options:{A:"Avoid contact with farm animals",B:"Drink only bottled water",C:"Take prophylactic medication",D:"Wear shoes and use proper toilets"},answer:"D"},
    {question:"What is the diagnostic stage of intestinal strongyloidiasis?",options:{A:"Mature egg",B:"Rhabditiform larva",C:"Filariform larva",D:"Rhabditiform or filariform larva"},answer:"B"},
    {question:"Which of the following is the cause of death in strongyloidiasis?",options:{A:"Disseminated infection",B:"Rectal prolapse",C:"Iron deficiency anemia"},answer:"A"},
    {question:"What is the infective stage of strongyloidiasis?",options:{A:"Mature egg",B:"Fertilized egg",C:"Filariform larva",D:"Rhabditiform larva"},answer:"C"},
    {question:"How can man get infected with Strongyloides?",options:{A:"Penetration of the skin",B:"Ingestion of eggs from contaminated hands",C:"Inhalation of eggs"},answer:"A"},
    {question:"What is the cause of larva currens?",options:{A:"Internal autoinfection",B:"External autoinfection",C:"Heteroinfection"},answer:"B"},
    {question:"What is the type of vitamin deficiency with intestinal strongyloidiasis?",options:{A:"Vitamin A",B:"Vitamin B12",C:"Vitamin E"},answer:"B"},
    {question:"Which technique depends on the hydrophilic nature of the nematode larvae?",options:{A:"Sedimentation technique",B:"Baermann's technique",C:"Entero-capsule test"},answer:"B"},
    {question:"When do you have to exclude strongyloidiasis?",options:{A:"Before chemotherapy",B:"In concomitant Ascaris infection",C:"Before starting antibiotics"},answer:"A"},
  ],
  "Lecture 3 - Ancylostoma and Heterophyes": [
    {question:"After skin penetration, what is the next step in the hookworm larvae migration?",options:{A:"To the kidney",B:"To the lungs",C:"To the liver",D:"Directly to the intestines"},answer:"B"},
    {question:"Which statement best describes the pulmonary phase of hookworm disease?",options:{A:"Chronic inflammation leads to stunted growth",B:"Larvae cause severe skin lesions",C:"Larvae migrate through the lungs, causing respiratory symptoms",D:"Adult worms feed on blood in the intestines"},answer:"C"},
    {question:"What is the scientific name for the skin reaction experienced when hookworm larvae penetrate the skin?",options:{A:"Larvae bite",B:"Larvae eczema",C:"Ground abscess",D:"Ground itch"},answer:"D"},
    {question:"What is the primary health problem caused by Ancylostoma duodenale feeding habits?",options:{A:"Bacterial infections of the gut",B:"Severe allergic reactions",C:"High blood pressure",D:"Anemia due to blood loss"},answer:"D"},
    {question:"What is a significant consequence of Ancylostoma duodenale infections in children?",options:{A:"Impaired cognitive development",B:"Increased blood pressure",C:"Autoimmune responses",D:"Impaired renal functions"},answer:"A"},
    {question:"Given the information about Ancylostoma duodenale, what can be implied about public health efforts in affected regions?",options:{A:"Hookworm infections primarily decrease through boiling water",B:"A combination of proper sanitation and health education is crucial",C:"Medical treatment is the only effective solution",D:"Education on hygiene is less important than medication"},answer:"B"},
    {question:"A community leader suggests that avoiding raw vegetables will prevent hookworm disease. Why is this advice insufficient for prevention?",options:{A:"Hookworms are spread by mosquito bites",B:"Hookworms are transmitted through raw fish",C:"Hookworms are transmitted through skin penetration by larvae",D:"Hookworms are only transmitted through raw meat"},answer:"C"},
    {question:"To effectively reduce chronic hookworm infections in a school-aged population, what comprehensive intervention plan would you propose?",options:{A:"Only provide iron supplements to all children",B:"Implement regular deworming, promote shoe-wearing",C:"Educate only parents about the disease",D:"Focus solely on treating symptomatic children"},answer:"B"},
    {question:"What is the diagnostic stage of hookworm disease?",options:{A:"Mature egg",B:"Fertilized egg",C:"Filariform larva",D:"Rhabditiform larva"},answer:"B"},
    {question:"Which of the following is a complication of hookworm disease?",options:{A:"Severe diarrhea",B:"Disseminated infection",C:"Delayed child development"},answer:"C"},
    {question:"What is the infective stage of hookworm disease?",options:{A:"Mature egg",B:"Fertilized egg",C:"Filariform larva",D:"Rhabditiform larva"},answer:"C"},
    {question:"How can man get infected with Ancylostoma duodenale?",options:{A:"Penetration of the skin",B:"Ingestion of eggs",C:"Inhalation of eggs"},answer:"A"},
    {question:"What is the cause of ground itch?",options:{A:"Internal autoinfection",B:"External autoinfection",C:"Heteroinfection"},answer:"C"},
    {question:"What is the type of anemia in hookworm disease?",options:{A:"Microcytic hypochromic",B:"Megaloblastic",C:"Pernicious"},answer:"A"},
    {question:"Which technique can be used to detect the intensity of intestinal helminthiasis?",options:{A:"Stoll's technique",B:"Baermann's technique",C:"Stool culture"},answer:"A"},
    {question:"Who are at risk to catch ancylostomiasis?",options:{A:"Fishermen",B:"Farmers",C:"Immunosuppressed"},answer:"B"},

    {question:"What is the hydatid sand?",options:{A:"Eggs of Echinococcus",B:"Free scolices of Echinococcus",C:"Free brood capsules",D:"Free brood capsules, scolices and daughter cysts"},answer:"D"},
    {question:"What is the main treatment of 3cm solitary hydatid cyst, in the liver?",options:{A:"Cystectomy",B:"Albendazole",C:"PAIR",D:"Cystectomy and albendazole"},answer:"D"},

  "All Lectures Quiz 1": [
    {question:"A 15-year-old boy presents with an itchy, maculopapular rash on his legs after swimming in a freshwater lake. This 'Swimmer's itch' is a:",options:{A:"Type I hypersensitivity reaction to cercarial antigens",B:"Type IV hypersensitivity reaction to soluble egg antigens",C:"Sign of adult worms maturing in the mesenteric veins",D:"Reaction to the 'inner lipoidal membrane' of eggs"},answer:"A"},
    {question:"A patient with Giardiasis develops a temporary intolerance to milk. This 'Disaccharidase deficiency' is specifically a deficiency in:",options:{A:"Protease",B:"Lactase",C:"Lipase",D:"Amylase"},answer:"B"},
    {question:"In H. nana, the oncosphere (hexacanth embryo) develops into which larval stage within the intestinal villus?",options:{A:"Cysticercus cellulosae",B:"Cysticercus bovis",C:"Cysticercoid larva",D:"Hydatid cyst"},answer:"C"},
    {question:"What is the 'infective stage' for both Giardia lamblia and Entamoeba histolytica?",options:{A:"Trophozoite",B:"Mature cyst",C:"Oocyst",D:"Miracidium"},answer:"B"},
    {question:"In the hepatosplenic form of Schistosomiasis, the 'first filter' that stops 75% of eggs is the:",options:{A:"Lung",B:"Spleen",C:"Liver",D:"Heart"},answer:"C"},
    {question:"A patient with long-standing Schistosomiasis presents to the ER vomiting bright red blood (hematemesis). What is the underlying pathological cause of this life-threatening event?",options:{A:"Ulceration of the gastric mucosa by adult worms",B:"Rupture of esophageal varices due to portal hypertension",C:"Bleeding from colonic polyps (Bilharziomas)",D:"Traumatic migration of metacercariae through the liver"},answer:"B"},
    {question:"Which miscellaneous protozoan is the largest infecting man, utilizes a pig reservoir, and moves by cilia?",options:{A:"Cryptosporidium parvum",B:"Isospora belli",C:"Balantidium coli",D:"Microsporidia"},answer:"C"},
    {question:"What is the infective stage for humans in the lifecycle of Fasciola hepatica?",options:{A:"Miracidium swimming in freshwater",B:"Furcocercus cercaria penetrating the skin",C:"Encysted metacercaria on watercress or water plants",D:"Adult fluke ingested in raw liver"},answer:"C"},
    {question:"In Heterophyes heterophyes, the snail intermediate host Pirenella conica is found in which environment?",options:{A:"Fresh water only",B:"Moist, shaded soil",C:"Brackish water (Mediterranean and SE Asia)",D:"Fast-flowing mountain streams"},answer:"C"},
    {question:"A patient is diagnosed with chronic Fascioliasis. Which drug is the first-line, most effective treatment for this liver fluke infection?",options:{A:"Praziquantel",B:"Metronidazole",C:"Triclabendazole",D:"Albendazole"},answer:"C"},
    {question:"A clinician is examining a stool sample and identifies an egg that is non-operculated and possesses a prominent lateral spine. Which parasite does this egg belong to?",options:{A:"Fasciola hepatica",B:"Heterophyes heterophyes",C:"Schistosoma mansoni",D:"Ascaris lumbricoides"},answer:"C"},
    {question:"Cor-pulmonale is specifically defined as:",options:{A:"Left-sided heart failure",B:"Right-sided heart failure",C:"Valvular stenosis",D:"Pericardial effusion"},answer:"B"},
    {question:"A 6-year-old child from a rural tropical region presents with a persistent dry cough, high fever, and wheezing. A chest X-ray reveals transient, migratory pulmonary infiltrates. A blood count shows significant eosinophilia. Which biological event most likely explains the patient's respiratory symptoms?",options:{A:"Intestinal obstruction by adult worms",B:"Larvae penetrating alveolar walls and ascending the bronchial tree",C:"Hypersensitivity to ingested unfertilized eggs",D:"Hematogenous spread of adult worms to the pulmonary artery"},answer:"B"},
    {question:"Which non-pathogenic amoeba is often misdiagnosed as E. histolytica but possesses more than 4 nuclei in its cystic stage?",options:{A:"Entamoeba coli",B:"Iodamoeba butschlii",C:"Endolimax nana",D:"Balantidium coli"},answer:"A"},
    {question:"A clinician is examining a gravid proglottid passed in a patient's stool. The proglottid has 25 lateral uterine branches. Which parasite and management plan are indicated?",options:{A:"Taenia solium; Treat with Praziquantel for 7 days",B:"Taenia saginata; Treat with Niclosamide (single dose of 4 tablets)",C:"Hymenolepis nana; Treat with Diloxanide furoate",D:"Echinococcus granulosus; Perform surgical aspiration"},answer:"B"},
    {question:"A 40-year-old woman presents with biliary colic, intolerance to fatty foods, and jaundice. Stool analysis reveals large, yellowish, operculated eggs. Which diagnostic procedure would be most effective for both confirming the diagnosis and extracting the adult worms?",options:{A:"Barium swallow",B:"Enterotest",C:"Endoscopic Retrograde Cholangiopancreatography (ERCP)",D:"Sputum analysis"},answer:"C"},
    {question:"A clinician uses a 'String test' (Entero-capsule) to recover trophozoites. Which parasite is this diagnostic technique specifically used for when stool exams are negative?",options:{A:"Entamoeba histolytica",B:"Giardia lamblia",C:"Schistosoma mansoni",D:"Taenia solium"},answer:"B"},
    {question:"In a heavy Ascaris infection, which non-specific pathogenesis is often seen in children?",options:{A:"Megaloblastic anemia",B:"Reduced food intake and impaired cognitive functions",C:"Right-sided heart failure (Cor-pulmonale)",D:"Seizures and focal neurological deficits"},answer:"B"},
    {question:"'Tenesmus' in chronic intestinal schistosomiasis refers to:",options:{A:"Bloody vomiting",B:"An unrelieved, painful desire to defecate",C:"Grinding of teeth at night",D:"Enlargement of the spleen"},answer:"B"},
    {question:"A 35-year-old male presents with sudden, severe pharyngitis, dysphagia, and a sensation of a foreign body in his throat after consuming raw lamb liver. On examination, a living fluke is seen attached to the laryngopharyngeal mucosa. What is the clinical name for this presentation?",options:{A:"Katayama fever",B:"Halzoun syndrome",C:"Loeffler's syndrome",D:"Swimmer's itch"},answer:"B"},
    {question:"[Comparative] Comparing Echinococcus granulosus and Taenia solium, which statement is true?",options:{A:"Humans are the definitive host for both",B:"Humans are the accidental intermediate host for the larval stages of both",C:"Both are treated with a single dose of Niclosamide",D:"Both utilize the pig as the only intermediate host"},answer:"B"},
    {question:"Which virulence factor of E. histolytica is a specific ligand used to adhere to the intestinal epithelium?",options:{A:"Ionophore-like protein",B:"Lectin",C:"Sucking disc",D:"Spiny cuticle"},answer:"B"},
    {question:"After penetrating the skin, the larvae lose their tails and transform into:",options:{A:"Adult worms",B:"Miracidia",C:"Schistosomula",D:"Rediae"},answer:"C"},
    {question:"An HIV-positive patient presents with severe, life-threatening watery diarrhea. Stool analysis reveals spherical oocysts (4-5 microns) that are 'directly infective' when passed. What is the most likely opportunistic pathogen?",options:{A:"Giardia lamblia",B:"Cryptosporidium parvum",C:"Balantidium coli",D:"Entamoeba histolytica"},answer:"B"},
    {question:"Giardia lamblia trophozoites are primarily found in which part of the gastrointestinal tract due to its alkaline environment?",options:{A:"Large intestine (caecum and sigmoid colon)",B:"Duodenum and jejunum",C:"Mouth cavity",D:"Rectum"},answer:"B"},
    {question:"Which protozoan inhabits the mouth cavity, has no cystic stage, and is more common in patients with periodontal disease?",options:{A:"Entamoeba coli",B:"Entamoeba gingivalis",C:"Giardia lamblia",D:"Balantidium coli"},answer:"B"},
    {question:"A patient in a rural clinic presents with symptoms of acute appendicitis. During surgery, the surgeon finds a large, 35 cm nematode obstructing the appendiceal opening. Which morphological feature would identify this parasite as a female?",options:{A:"A coiled posterior end with copulatory spicules",B:"A length of approximately 5-10 cm",C:"Tapered ends and a length exceeding 40 cm",D:"Presence of a globular scolex with four suckers"},answer:"C"},
    {question:"The drug Praziquantel is the treatment of choice for:",options:{A:"Fasciola hepatica",B:"Heterophyes heterophyes",C:"Ascaris lumbricoides",D:"Capillaria philippinensis"},answer:"B"},
    {question:"Which morphological feature identifies a mature Entamoeba histolytica cyst in a well-formed stool sample?",options:{A:"2 nuclei and four pairs of flagella",B:"4 nuclei and cigar-shaped chromatid bars",C:"8 nuclei and a central karyosome",D:"1 nucleus and a large sucking disc"},answer:"B"},
    {question:"A 7-year-old child presents with severe diarrhea, irritability, and epileptiform convulsions. Stool exam shows the smallest cestode infecting man (4-5 cm). What is the 'So What?' risk of this parasite in children?",options:{A:"It causes obstructive jaundice",B:"Internal autoinfection can lead to fatal hyperinfection",C:"It causes megaloblastic anemia due to B12 deficiency",D:"It migrates to the lungs causing Loeffler's syndrome"},answer:"B"},
  ],

  "All Lectures Quiz 2": [
    {question:"A 22-year-old farmer from the Nile Delta presents with high fever, cough, abdominal pain, and hepatosplenomegaly. He reports swimming in the canal several weeks ago. Laboratory tests show marked eosinophilia. What is the most likely diagnosis?",options:{A:"Chronic intestinal schistosomiasis",B:"Katayama fever (Acute schistosomiasis)",C:"Swimmer's itch (Cercarial dermatitis)",D:"Halzoun syndrome"},answer:"B"},
    {question:"What is the 'So What?' significance of portosystemic shunts in Schistosomiasis?",options:{A:"They prevent eggs from reaching the liver",B:"They allow toxic metabolites and eggs to reach the general circulation and brain",C:"They are a sign of successful treatment with Praziquantel",D:"They increase the absorption of B12 and folic acid"},answer:"B"},
    {question:"Which statement describes the diagnostic stage of Heterophyes heterophyes found in stool?",options:{A:"Large, yellowish, and operculated eggs",B:"Small, 30x15 μm, mature eggs containing a miracidium",C:"Immature eggs that must embryonate in water",D:"Rhabditiform larvae with a short buccal cavity"},answer:"B"},
    {question:"Tissue destruction in amoebiasis is caused by which group of enzymes?",options:{A:"Lactase and Xylase",B:"Phospholipase, Proteinase, and Hydrolase",C:"SEA and Ascaron",D:"Amylase and Pepsin"},answer:"B"},
    {question:"How many 'vesicular nuclei' are found in a single Giardia lamblia trophozoite?",options:{A:"1",B:"2",C:"4",D:"8"},answer:"B"},
    {question:"The incubation period for Hydatid disease (time before symptoms develop) can last:",options:{A:"1 week",B:"2 to 20 years",C:"3 months",D:"18 days"},answer:"B"},
    {question:"[Comparative] Differentiating the adult stages of T. saginata and T. solium is best achieved by:",options:{A:"Microscopic examination of the eggs (which are identical)",B:"Counting the lateral uterine branches in a gravid proglottid (15-30 vs 5-10)",C:"Observing the presence of a lateral spine",D:"Measuring the length of the rhabditiform larvae"},answer:"B"},
    {question:"How do Schistosoma eggs reach the intestinal lumen for excretion?",options:{A:"They are carried by adult worms",B:"They use pressure and proteolytic secretions to penetrate the mucosa",C:"They travel through the bile duct",D:"They are released when the mesenteric vein ruptures"},answer:"B"},
    {question:"Which statement accurately describes the egg of Taenia species?",options:{A:"It has mucoid polar plugs",B:"It is 40 μm with a brown striated shell and contains an oncosphere",C:"It has a prominent lateral spine",D:"It is operculated and yellowish"},answer:"B"},
    {question:"A patient with advanced schistosomiasis presents with 'Caput medusa' around the umbilicus and ascites. These signs indicate:",options:{A:"Migration of adult worms to the subcutaneous tissue",B:"Advanced portal hypertension and collateral circulation",C:"Hypersensitivity to the toxic body fluid 'Ascaron'",D:"Obstruction of the biliary duct by a 'Bilharzioma'"},answer:"B"},
    {question:"Which statement correctly describes the male S. mansoni worm?",options:{A:"It is 10 meters long and quadrate",B:"It has a gynaecophoric canal to hold the female",C:"It is leaf-like with a spiny cuticle",D:"It has three suckers: oral, ventral, and genital"},answer:"B"},
    {question:"Which cestode is the only one capable of completing its entire life cycle in a single host (Man)?",options:{A:"Taenia saginata",B:"Taenia solium",C:"Hymenolepis nana",D:"Echinococcus granulosus"},answer:"C"},
    {question:"A 30-year-old shepherd presents with right hypochondrial pain and abdominal distension. Upon percussion of the liver, the physician elicits a 'hydatid thrill.' What is the clinical significance of this finding?",options:{A:"It indicates the presence of adult tapeworms in the intestine",B:"It is diagnostic of an Echinococcus granulosus cyst containing daughter cysts",C:"It suggests the patient has a heavy Ascaris infection",D:"It is a sign of portal hypertension and Caput medusa"},answer:"B"},
    {question:"In the context of Capillaria philippinensis, why is the 'fisherman' demographic at the highest risk?",options:{A:"They are exposed to snail intermediate hosts in brackish water",B:"They have a habit of eating raw freshwater fish",C:"They are exposed to soil contaminated with bird feces",D:"They work in areas with poor sewage disposal for livestock"},answer:"B"},
    {question:"'Hydatid sand' is a diagnostic term referring to:",options:{A:"Calcified remnants of a dead cyst",B:"Floating protoscolices and daughter cysts within the hydatid fluid",C:"Eggs passed in the stool of an infected human",D:"Grains of sand found in soil contaminated with dog feces"},answer:"B"},
    {question:"[Comparative] Comparing the 'Acute Stage' of Fasciola and Schistosoma (Katayama fever), which feature is shared?",options:{A:"Both are triggered by adult worms in the bile duct",B:"Both present with fever, hepatomegaly, and high eosinophilia",C:"Both are treated primarily with Diloxanide furoate",D:"Both are acquired by eating raw fish"},answer:"B"},
    {question:"A patient with biliary colic and jaundice is treated with Nitazoxanide. This is an alternative drug for:",options:{A:"Acute Heterophyes infection",B:"Chronic Fasciola infection",C:"Neurocysticercosis",D:"Amoebic liver abscess"},answer:"B"},
    {question:"Entamoeba histolytica belongs to which subphylum?",options:{A:"Ciliophora",B:"Sarcodina",C:"Mastigophora",D:"Apicomplexa"},answer:"B"},
    {question:"Which morphological feature distinguishes the scolex of Taenia saginata from Taenia solium?",options:{A:"T. saginata has a rostellum with hooks; T. solium is quadrate",B:"T. saginata is quadrate and lacks hooks; T. solium is globular with hooks",C:"T. saginata has a genital sucker; T. solium has four suckers",D:"T. saginata has a bifurcated tail; T. solium has a spiny cuticle"},answer:"B"},
    {question:"A patient is suspected of having a heavy S. mansoni infection. The clinician orders a Kato-Katz thick smear. What is the primary clinical utility of this specific test?",options:{A:"It identifies the presence of antibodies in the serum",B:"It provides quantitative data on the intensity of infection",C:"It allows for the visualization of adult worms in the portal vein",D:"It distinguishes between S. mansoni and S. haematobium based on the terminal spine"},answer:"B"},
    {question:"A 45-year-old male presents with stabbing right hypochondrial pain. A liver aspirate yields 'anchovy paste' fluid. What is the 'So What?' of this fluid's appearance?",options:{A:"It contains 80% eosinophils and miracidia",B:"It consists of chocolate-brown necrotic liver tissue caused by E. histolytica",C:"It is diagnostic of a ruptured hydatid cyst",D:"It is a byproduct of biliary lithiasis"},answer:"B"},
    {question:"What is the 'So What?' clinical risk of 'Internal Autoinfection' in Taenia solium?",options:{A:"The patient will pass more gravid segments independently of defecation",B:"Eggs are carried by reverse peristalsis to the stomach, hatching and causing cysticercosis",C:"The adult worm will grow to 10 meters, causing intestinal obstruction",D:"The patient will develop B12 deficiency and anemia"},answer:"B"},
    {question:"'Melena' (black, tarry stool) in a Schistosoma patient is a clinical sign of:",options:{A:"Intestinal polyposis",B:"Ruptured esophageal varices",C:"Biliary obstruction",D:"Cercarial dermatitis"},answer:"B"},
    {question:"A child presents with an inflamed, painful eye. A young fluke is surgically removed from the anterior chamber. This condition, 'Ophthalmofascioliasis,' is an example of:",options:{A:"Normal maturation of the parasite",B:"Ectopic fascioliasis",C:"Halzoun syndrome",D:"False fascioliasis"},answer:"B"},
    {question:"A patient with neurocysticercosis is often misdiagnosed as having:",options:{A:"Primary epilepsy or tuberculosis of the brain",B:"Biliary colic",C:"Steatorrhea",D:"Loeffler's syndrome"},answer:"A"},
    {question:"A 4-year-old child presents with severe malnutrition and impaired cognitive function. Stool microscopy reveals bile-stained, round-to-oval eggs (60 μm) with a coarsely mamillated albuminoid coat. What is the primary clinical significance of the 'inner lipoidal vitelline membrane' of these eggs?",options:{A:"It facilitates attachment to the jejunal mucosa",B:"It is responsible for the egg's extreme environmental resistance",C:"It allows the larva to hatch immediately in the soil",D:"It triggers the host's eosinophilic granuloma response"},answer:"B"},
    {question:"What is the defining morphological difference between male and female Ascaris worms?",options:{A:"Males are longer than 40 cm",B:"Males have a coiled posterior end with a pair of copulatory spicules",C:"Females have a rostellum with hooks",D:"Females have a gynaecophoric canal"},answer:"B"},
    {question:"Which parasitic stage of Ascaris is responsible for causing eosinophilic granulomas in the liver?",options:{A:"Adult worms",B:"Ingested eggs",C:"Migrating larvae",D:"Unfertilized eggs"},answer:"C"},
    {question:"A 50-year-old male with chronic Schistosomiasis develops right-sided heart failure. Pathologically, this is due to:",options:{A:"Adult worms living in the right ventricle",B:"Egg deposition in the perialveolar capillaries leading to granulomatous reaction and fibrosis",C:"Myocarditis caused by ectopic eggs in the heart muscle",D:"Toxicity from the Circulating Anodic Antigen (CAA)"},answer:"B"},
    {question:"The adult Fasciola fluke is described as:",options:{A:"Pyriform and 1.5 mm long",B:"Leaf-like, 3x1.5 cm, with a spiny cuticle",C:"Segmented and 10 meters long",D:"Round and pinkish-white"},answer:"B"},

  "All Lectures Quiz 3": [
    {question:"A 9-year-old boy is brought to the clinic with irritability, excessive salivation, and nocturnal teeth-grinding. His mother reports he recently vomited a 25 cm pinkish-white worm. What predisposing factor most likely triggered this expulsion?",options:{A:"Vitamin A deficiency in the child's diet",B:"Surgical anesthesia or a recent high fever",C:"Ingestion of undercooked freshwater fish",D:"Maturation of eggs in the child's small intestine"},answer:"B"},
    {question:"Ectopic Fasciola flukes have been found in all the following sites EXCEPT:",options:{A:"Brain and eye",B:"Lung and heart",C:"Pancreas and spleen",D:"Small intestine lumen"},answer:"D"},
    {question:"A patient presents with fever and cough. The physician finds larvae in the sputum. Which phase of the Ascaris life cycle is the patient currently in?",options:{A:"Phase II: Adult stage in the intestine",B:"Phase I: Larval migration through the lungs",C:"Latent phase: Maturation in the bile duct",D:"Invasive phase: Cercarial penetration"},answer:"B"},
    {question:"A patient presents with 'Amoebic hepatitis.' This is characterized by:",options:{A:"A single large abscess in the left lobe",B:"Small necrotic foci that may coalesce to form an abscess",C:"Development of gallstones",D:"Right-sided heart failure"},answer:"B"},
    {question:"What is a long-term complication of the chronic stage of Fascioliasis due to inflammation and hyperplasia of the bile ducts?",options:{A:"Myocarditis",B:"Biliary lithiasis (gallstones)",C:"Megaloblastic anemia",D:"Neurocysticercosis"},answer:"B"},
    {question:"[Comparative] In a patient with HIV, which of the following pairs of parasites are considered 'opportunistic' and most likely to cause severe disease?",options:{A:"Ascaris lumbricoides and Taenia saginata",B:"Cryptosporidium parvum and Hymenolepis nana",C:"Fasciola hepatica and Schistosoma mansoni",D:"Entamoeba coli and Heterophyes heterophyes"},answer:"B"},
    {question:"Which diagnostic marker is highly specific for an active Schistosoma infection and can be detected in serum or urine?",options:{A:"Circulating Anodic Antigen (CAA)",B:"Schistosomal antibodies (IHA)",C:"Eosinophil count",D:"Fecal occult blood"},answer:"A"},
    {question:"The pathological 'granuloma' in Schistosomiasis is primarily a response to:",options:{A:"The physical presence of the adult worm",B:"Soluble egg antigens (SEA) secreted by the eggs",C:"The movement of schistosomula through the lungs",D:"The breakdown of the worm's tegument by Praziquantel"},answer:"B"},
    {question:"Extra-intestinal amoebiasis occurs when trophozoites reach the liver via the:",options:{A:"Common bile duct",B:"Portal circulation",C:"Lymphatic system",D:"Direct penetration through the abdominal wall"},answer:"B"},
    {question:"Why is the detection of Schistosomal antibodies (e.g., IHA or CFT) considered 'not very useful' for definitive clinical diagnosis in endemic areas?",options:{A:"The tests are too expensive",B:"They cannot differentiate between present and past infection",C:"They only detect the larval stages",D:"They cross-react with Ascaris"},answer:"B"},
    {question:"A patient from a rural area presents with high fever, right upper quadrant pain, hepatomegaly, and a blood count showing 75% eosinophilia. The physician suspects the acute phase of Fascioliasis. What biological process is occurring at this stage?",options:{A:"Adult worms are obstructing the common bile duct",B:"Young flukes are migrating through the liver parenchyma",C:"Encysted metacercariae are attaching to the intestinal wall",D:"Eggs are being trapped in the portal tributaries"},answer:"B"},
    {question:"The term 'Metastatic effect' in Hydatid disease refers to:",options:{A:"The cancerous transformation of the liver",B:"The dissemination of scolices to other organs following cyst rupture",C:"The movement of adult worms to the brain",D:"The development of multiple worms from one egg"},answer:"B"},
    {question:"What is the role of fish-eating birds in the lifecycle of Capillaria philippinensis?",options:{A:"They are the only definitive host",B:"They serve as the natural reservoir host",C:"They are the intermediate host where larvae encyst",D:"They are accidental hosts with no role in transmission"},answer:"B"},
    {question:"A child living in an area where human feces are used as fertilizer presents with urticaria and asthma-like symptoms. The clinician explains this is a hypersensitivity reaction to 'Ascaron.' What is Ascaron?",options:{A:"A metabolic product of the larval stage in the lungs",B:"A toxic body fluid released by adult Ascaris worms",C:"The mucoid substance in Capillaria polar plugs",D:"The outer albuminoid coat of the egg"},answer:"B"},
    {question:"A 28-year-old male presents with colicky abdominal pain and mucous diarrhea. He recently returned from a coastal region where he frequently consumed under-pickled 'Fesikh' fish. The clinician suspects Heterophyes heterophyes. What is the 'So What?' clinical risk if the small eggs of this parasite enter the circulation?",options:{A:"Development of biliary lithiasis (gallstones)",B:"Fatal myocarditis or encephalitis",C:"Obstructive jaundice and liver abscess",D:"Pulmonary fibrosis and Cor-pulmonale"},answer:"B"},
    {question:"Which drug is the primary 'Tissue drug' used for invasive amoebiasis and giardiasis?",options:{A:"Diloxanide furoate",B:"Metronidazole",C:"Niclosamide",D:"Albendazole"},answer:"B"},
    {question:"'External autoinfection' in Hymenolepis nana and Taenia solium is primarily due to:",options:{A:"Reverse peristalsis",B:"Bad hygiene and contaminated hands",C:"Eating undercooked meat",D:"Swimming in contaminated water"},answer:"B"},
    {question:"High eosinophilia (up to 80%) is a hallmark clinical finding in which stage of Fascioliasis?",options:{A:"Acute phase",B:"Chronic phase",C:"False Fascioliasis",D:"Halzoun syndrome"},answer:"A"},
    {question:"A patient is found to have a single, firm, palpable mass in the caecum. The clinician initially suspects carcinoma, but the patient's history reveals recurrent amebic dysentery. What is the most likely parasitic complication?",options:{A:"Amoebic liver abscess",B:"Amoeboma (Amoebic granuloma)",C:"Bilharzioma",D:"Hydatid cyst"},answer:"B"},
    {question:"How does a human acquire the larval stage (cysticercosis) of Taenia solium?",options:{A:"By eating undercooked pork containing cysticerci",B:"By ingesting Taenia solium eggs (hetero- or autoinfection)",C:"By skin penetration of furcocercus cercariae",D:"By eating raw beef containing Cysticercus bovis"},answer:"B"},
    {question:"Which organ is the most common site for Echinococcus granulosus cysts because it acts as the 'first filter'?",options:{A:"Lung",B:"Brain",C:"Liver (75% of cases)",D:"Spleen"},answer:"C"},
    {question:"A 28-year-old patient presents with 'frank diarrhea' containing blood and mucus (dysentery) and gripping abdominal pain. Microscopy of the loose stool reveals motile trophozoites with ingested red blood cells. What is the pathognomonic significance of these trophozoites?",options:{A:"They indicate a non-pathogenic commensal infection",B:"They are diagnostic of invasive, tissue-invading Entamoeba histolytica",C:"They suggest the patient has Giardia lamblia",D:"They indicate the presence of Entamoeba coli"},answer:"B"},
    {question:"The 'infective stage' for human hydatid disease is the:",options:{A:"Hydatid cyst in undercooked meat",B:"Mature egg in dog feces",C:"Protoscolex in hydatid sand",D:"Oncosphere in the cattle's intestine"},answer:"B"},
    {question:"Which morphological part of the Taenia worm is the 'germinative' portion responsible for producing new segments?",options:{A:"Scolex",B:"Neck",C:"Gravid proglottid",D:"Strobila"},answer:"B"},
    {question:"The 'Stage of Invasion' involves a:",options:{A:"Type I hypersensitivity reaction",B:"Type II hypersensitivity reaction",C:"Type III hypersensitivity reaction",D:"Type IV hypersensitivity reaction"},answer:"A"},
    {question:"A patient presents with cough, dyspnea, and hemoptysis. A chest X-ray shows a large, well-defined cyst in the lung. If this is a hydatid cyst, what might be found in the patient's sputum?",options:{A:"Gravid proglottids",B:"Scolices (protoscolices)",C:"Immature operculated eggs",D:"Rhabditiform larvae"},answer:"B"},
    {question:"Prevention of Taenia saginata involves:",options:{A:"Snail destruction",B:"Proper cooking of beef",C:"Avoid eating raw fish",D:"Mass treatment of dogs"},answer:"B"},
    {question:"[Comparative] Regarding autoinfection, which statement is correct?",options:{A:"Ascaris eggs can hatch in the intestine if the patient is constipated",B:"Capillaria larvae can re-invade the mucosa leading to uncontrolled hyperinfection",C:"Both parasites require soil maturation for eggs to become infective",D:"Neither parasite is capable of increasing its worm burden without external re-exposure"},answer:"B"},
    {question:"Which finding is most characteristic of the blood picture throughout all stages of schistosomiasis?",options:{A:"Neutrophilia",B:"Eosinophilia",C:"Thrombocytosis",D:"Leukopenia"},answer:"B"},
    {question:"A 'calcified' hydatid cyst found incidentally on an X-ray usually indicates:",options:{A:"Active hyperinfection",B:"Spontaneous healing (the parasite is dead)",C:"Imminent rupture",D:"Ectopic migration to the eye"},answer:"B"},
  ],

  "All Lectures Quiz 4": [
    {question:"The 'Coproantigen' detection by ELISA is applied for the routine diagnosis of:",options:{A:"Ascaris and Fasciola",B:"Entamoeba histolytica and Giardia",C:"Taenia saginata",D:"Schistosoma mansoni"},answer:"B"},
    {question:"A 25-year-old patient presents with new-onset seizures and focal neurological deficits. Imaging reveals multiple 'space-occupying lesions' (calcified cysts) in the brain. The patient has a history of poor hand hygiene. What is the most likely diagnosis?",options:{A:"Hydatid disease",B:"Neurocysticercosis",C:"Intestinal Taeniasis",D:"Cerebral Schistosomiasis"},answer:"B"},
    {question:"What is the primary cause of death in untreated intestinal capillariasis?",options:{A:"Intestinal perforation and peritonitis",B:"Dehydration, cachexia, and cardiomyopathy",C:"Biliary cirrhosis and liver failure",D:"Anaphylactic shock from cyst rupture"},answer:"B"},

/* ══════════════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════════════ */
let currentQuestions = [];
let currentIndex     = 0;
let userAnswers      = {};   // {index: "A"|"B"|...}
let markedSet        = new Set();
let timeLeft         = 0;
let timerInterval    = null;

/* ══════════════════════════════════════════════════════════
   INIT — populate lecture select
══════════════════════════════════════════════════════════ */
(function init() {
  const sel = document.getElementById('lectureSelect');
  Object.keys(lectures).forEach(name => {
    const opt = document.createElement('option');
    opt.value = name; opt.textContent = name;
    sel.appendChild(opt);
  });
})();

/* ══════════════════════════════════════════════════════════
   SCREEN SWITCHING
══════════════════════════════════════════════════════════ */
function showScreen(id) {
  ['home','quiz','results'].forEach(s => {
    document.getElementById(s).classList.toggle('hidden', s !== id);
  });
}

/* ══════════════════════════════════════════════════════════
   HOME → START
══════════════════════════════════════════════════════════ */
function startQuiz() {
  const lec  = document.getElementById('lectureSelect').value;
  const mins = parseInt(document.getElementById('timeInput').value, 10);

  if (!lec)             return alert('Please choose a lecture first.');
  if (!mins || mins<=0) return alert('Please enter a valid duration in minutes.');

  currentQuestions = lectures[lec];
  currentIndex     = 0;
  userAnswers      = {};
  markedSet        = new Set();
  timeLeft         = mins * 60;

  showScreen('quiz');
  renderQuestion();
  startTimer();
}

/* ══════════════════════════════════════════════════════════
   TIMER
══════════════════════════════════════════════════════════ */
function startTimer() {
  stopTimer();
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    timeLeft--;
    if (timeLeft <= 0) { timeLeft = 0; updateTimerDisplay(); stopTimer(); submitQuiz(); }
    else { updateTimerDisplay(); }
  }, 1000);
}
function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}
function updateTimerDisplay() {
  const m = String(Math.floor(timeLeft/60)).padStart(2,'0');
  const s = String(timeLeft%60).padStart(2,'0');
  const el = document.getElementById('timerDisplay');
  el.textContent = `${m}:${s}`;
  el.classList.toggle('urgent', timeLeft <= 60);
}

/* ══════════════════════════════════════════════════════════
   RENDER QUESTION
══════════════════════════════════════════════════════════ */
function renderQuestion() {
  const q      = currentQuestions[currentIndex];
  const total  = currentQuestions.length;
  const opts   = Object.entries(q.options);

  document.getElementById('qNumber').textContent = `Q${currentIndex+1} / ${total}`;
  document.getElementById('qText').textContent   = q.question;

  const list = document.getElementById('optionsList');
  list.innerHTML = '';

  opts.forEach(([key, val]) => {
    const saved = userAnswers[currentIndex] || '';
    const label = document.createElement('label');
    label.className = 'option-label' + (saved === key ? ' selected' : '');

    label.innerHTML = `
      <input type="radio" name="q${currentIndex}" value="${key}" ${saved===key?'checked':''} />
      <span class="opt-key">${key}.</span>
      <span>${val}</span>
    `;
    label.addEventListener('click', () => selectAnswer(key));
    list.appendChild(label);
  });

  updateMarkBtn();
  renderNavigator();
}

function selectAnswer(key) {
  userAnswers[currentIndex] = key;
  document.querySelectorAll('.option-label').forEach(lbl => {
    const inp = lbl.querySelector('input');
    lbl.classList.toggle('selected', inp.value === key);
  });
  renderNavigator();
}

/* ══════════════════════════════════════════════════════════
   NAVIGATOR
══════════════════════════════════════════════════════════ */
function renderNavigator() {
  const grid = document.getElementById('navGrid');
  grid.innerHTML = '';
  currentQuestions.forEach((_, i) => {
    const btn = document.createElement('button');
    btn.className = 'nav-btn ' + navState(i);
    btn.textContent = i + 1;
    btn.onclick = () => goTo(i);
    grid.appendChild(btn);
  });
}
function navState(i) {
  if (i === currentIndex)  return 'state-current';
  if (markedSet.has(i))    return 'state-marked';
  if (userAnswers[i])      return 'state-answered';
  return 'state-default';
}

/* ══════════════════════════════════════════════════════════
   NAVIGATION
══════════════════════════════════════════════════════════ */
function goTo(i) {
  currentIndex = i;
  renderQuestion();
}
function prevQ() {
  if (currentIndex > 0) goTo(currentIndex - 1);
}
function nextQ() {
  if (currentIndex < currentQuestions.length - 1) goTo(currentIndex + 1);
}

/* ══════════════════════════════════════════════════════════
   MARK
══════════════════════════════════════════════════════════ */
function toggleMark() {
  if (markedSet.has(currentIndex)) markedSet.delete(currentIndex);
  else markedSet.add(currentIndex);
  updateMarkBtn();
  renderNavigator();
}
function updateMarkBtn() {
  const btn = document.getElementById('markBtn');
  btn.classList.toggle('is-marked', markedSet.has(currentIndex));
  btn.textContent = markedSet.has(currentIndex) ? '🔴 Unmark' : '🔴 Mark / Unmark';
}

/* ══════════════════════════════════════════════════════════
   SUBMIT
══════════════════════════════════════════════════════════ */
function confirmSubmit() {
  const unanswered = currentQuestions.length - Object.keys(userAnswers).length;
  if (unanswered > 0) {
    if (!confirm(`You still have ${unanswered} unanswered question(s). Submit anyway?`)) return;
  }
  submitQuiz();
}

function submitQuiz() {
  stopTimer();
  const total  = currentQuestions.length;
  let   score  = 0;
  currentQuestions.forEach((q, i) => {
    if (userAnswers[i] === q.answer) score++;
  });

  const pct = Math.round(score / total * 100);
  const emoji = pct === 100 ? '🏆' : pct >= 70 ? '🎉' : '📝';

  document.getElementById('resultsTitle').textContent = `${emoji}  Quiz Results`;
  const badge = document.getElementById('scoreBadge');
  badge.textContent = `${score} / ${total}  (${pct}%)`;
  badge.style.background = pct >= 70 ? '#A5D6A7' : '#FFCDD2';

  buildResults(score, total);
  showScreen('results');
}

function buildResults(score, total) {
  const body = document.getElementById('resultsBody');
  body.innerHTML = '';

  currentQuestions.forEach((q, i) => {
    const userAns  = userAnswers[i] || '';
    const correct  = q.answer;
    const isOk     = userAns === correct;
    const isUnansw = userAns === '';
    const isMark   = markedSet.has(i);

    let cls, statusText, statusClass, stripColor;
    if (isOk) {
      cls='correct'; statusText='✔  Correct';    statusClass='correct'; stripColor='var(--correct-fg)';
    } else if (isUnansw) {
      cls='unanswered'; statusText='—  Not answered'; statusClass='unanswered'; stripColor='var(--unanswered-fg)';
    } else {
      cls='wrong'; statusText='✘  Incorrect';   statusClass='wrong';   stripColor='var(--wrong-fg)';
    }

    const card = document.createElement('div');
    card.className = `r-card ${cls}`;
    card.innerHTML = `
      <div class="r-card-inner">
        <div class="r-strip" style="background:${stripColor}"></div>
        <div class="r-content">
          <div class="r-card-header">
            <div class="r-qnum">Q${i+1}${isMark?' &nbsp;🔴 Marked':''}</div>
            <div class="r-status ${statusClass}">${statusText}</div>
          </div>
          <div class="r-question">${q.question}</div>
          <div class="r-options"></div>
        </div>
      </div>
    `;

    const optsDiv = card.querySelector('.r-options');
    Object.entries(q.options).forEach(([key, val]) => {
      const isCorrectOpt = key === correct;
      const isUserOpt    = key === userAns;

      let bg='', fg='', pfx='';
      if (isCorrectOpt) { bg='#C8E6C9'; fg='#1B5E20'; pfx='✔'; }
      else if (isUserOpt) { bg='#FFCDD2'; fg='#B71C1C'; pfx='✘'; }

      const row = document.createElement('div');
      row.className = 'r-option';
      if (bg) { row.style.background=bg; row.style.border=`1px solid ${fg}`; row.style.borderRadius='6px'; }
      row.innerHTML = `<span class="r-opt-pfx" style="color:${fg||'var(--text-muted)'}">${pfx||' '}</span><strong style="color:${fg||'var(--text-muted)'};min-width:20px">${key}.</strong><span style="color:${fg||'var(--text-muted)'};${isCorrectOpt||isUserOpt?'font-weight:600':''}">${val}</span>`;
      optsDiv.appendChild(row);
    });

    body.appendChild(card);
  });
}

/* ══════════════════════════════════════════════════════════
   BACK TO HOME
══════════════════════════════════════════════════════════ */
function goHome() {
  stopTimer();
  showScreen('home');
}
</script>
